    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo_utfpr.png' | relative_url }}" alt="UTFPR" class="header-logo">
      <span>Canais Laterais &bull; UTFPR</span>
    </a>

    <!-- Navegação e Alternador de Tema -->
    <div style="display: flex; align-items: center;">
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon">

            </svg>
          </span>
        </label>

        <div class="trigger">
          <a class="page-link" href="{{ '/' | relative_url }}">Início</a>
          <a class="page-link" href="{{ '/problema/' | relative_url }}">O Problema</a>
          <a class="page-link" href="{{ '/sdr/' | relative_url }}">Rádios SDR</a>
          <a class="page-link" href="{{ '/sobre/' | relative_url }}">Sobre o Projeto</a>
          <a class="page-link" href="{{ '/referencias/' | relative_url }}">Referências</a>

      </nav>

      <!-- Botão de Alternância de Tema com Ícones SVG -->
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar modo claro e escuro" title="Alternar tema">
        <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none; width: 18px; height: 18px;">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none; width: 18px; height: 18px;">
          <path d="M12.3 2a10 10 0 0 0-1.9 19.8 10 10 0 0 0 11.5-11.5A10 10 0 0 0 12.3 2zm-1.1 17.8a8 8 0 1 1 8.6-8.6 8 8 0 0 1-8.6 8.6z"/>
        </svg>
      </button>
    </div>
    
  </div>
</header>

<script>
  (function() {
    const toggleButton = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('theme-icon-sun');
    const moonIcon = document.getElementById('theme-icon-moon');
    const htmlElement = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    let activeTheme = 'light';
    if (savedTheme) {
      activeTheme = savedTheme;
    } else if (systemPrefersDark) {
      activeTheme = 'dark';
    }

    applyTheme(activeTheme);

    toggleButton.addEventListener('click', function() {
      const current = htmlElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('theme', next);
    });

    function applyTheme(theme) {
      htmlElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
        toggleButton.setAttribute('title', 'Mudar para modo claro');
      } else {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
        toggleButton.setAttribute('title', 'Mudar para modo escuro');
      }
    }
  })();
</script>
