<!-- ESTILOS CSS COM SUPORTE A MODO ESCURO, TELA AMPLA E ANIMAÇÕES -->
<style>
  :root {
    --bg-color: #ffffff;
    --text-color: #111111;
    --header-bg: rgba(255, 255, 255, 0.95);
    --border-color: #e8e8e8;
    --link-color: #0056b3;
    --nav-link-color: #555555;
    --card-bg: #f8f9fa;
    --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    --card-shadow-hover: 0 10px 20px rgba(0, 0, 0, 0.1);
  }

  [data-theme="dark"] {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --header-bg: rgba(26, 26, 26, 0.95);
    --border-color: #2d2d2d;
    --link-color: #3793ff;
    --nav-link-color: #aaaaaa;
    --card-bg: #1e1e1e;
    --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    --card-shadow-hover: 0 10px 20px rgba(0, 0, 0, 0.5);
  }

  /* CONFIGURAÇÕES GERAIS COM TRANSIÇÃO SUAVE */
  body {
    background-color: var(--bg-color) !important;
    color: var(--text-color) !important;
    padding-top: 90px !important;
    transition: background-color 0.4s ease, color 0.4s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .wrapper {
    max-width: 95% !important;
    padding-left: 30px !important;
    padding-right: 30px !important;
  }

  .site-header {
    position: fixed !important;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    background-color: var(--header-bg) !important;
    backdrop-filter: blur(8px); /* Efeito moderno de vidro fosco */
    border-bottom: 1px solid var(--border-color) !important;
    transition: background-color 0.4s ease, border-color 0.4s ease;
  }

  .site-title, .site-title:visited {
    color: var(--text-color) !important;
    font-weight: 700;
  }
  
  .site-nav .page-link {
    color: var(--nav-link-color) !important;
    font-weight: 500;
    margin-left: 15px;
    transition: color 0.2s ease;
  }

  .site-nav .page-link:hover {
    color: var(--link-color) !important;
  }

  .header-logo {
    height: 42px !important;
    width: auto !important;
    vertical-align: middle;
    margin-right: 12px;
    margin-top: -3px;
    transition: transform 0.3s ease;
  }
  
  .header-logo:hover {
    transform: scale(1.05);
  }

  .theme-toggle-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    margin-left: 15px;
    font-size: 18px;
    color: var(--text-color);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .theme-toggle-btn:hover {
    transform: scale(1.2) rotate(15deg);
  }

  /* ==========================================
     CLASSES DE ANIMAÇÃO (A Serem Usadas no Markdown)
     ========================================== */
  
  /* 1. Suave revelação ao carregar a página */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fade-in {
    animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  /* Delay para criar efeito de cascata sequencial */
  .delay-1 { animation-delay: 0.15s; }
  .delay-2 { animation-delay: 0.3s; }
  .delay-3 { animation-delay: 0.45s; }

  /* 2. Cartões modernos com animação de foco */
  .info-card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--card-shadow);
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .info-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--card-shadow-hover);
    border-color: var(--link-color);
  }

  /* 3. Efeito estético nas imagens (sombra e borda arredondada) */
  .web-image {
    border-radius: 10px;
    box-shadow: var(--card-shadow);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    max-width: 100%;
    height: auto;
    margin: 15px 0;
  }
  
  .web-image:hover {
    transform: scale(1.02);
    box-shadow: var(--card-shadow-hover);
  }
</style>

<header class="site-header" role="banner">
  <div class="wrapper" style="display: flex; justify-content: space-between; align-items: center; height: 60px;">
    
    <!-- TÍTULO COM A LOGO DA UTFPR -->
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo_utfpr.png' | relative_url }}" alt="Logo UTFPR" class="header-logo">
      {{ site.title | escape }}
    </a>

    <!-- NAVEGAÇÃO E ALTERNADOR -->
    <div style="display: flex; align-items: center;">
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon">
            <svg viewBox="0 0 18 15" width="18px" height="15px">
              <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
            </svg>
          </span>
        </label>

        <div class="trigger">
          <a class="page-link" href="{{ '/' | relative_url }}">Início</a>
          <a class="page-link" href="{{ '/problema/' | relative_url }}">O Problema</a>
          <a class="page-link" href="{{ '/sdr/' | relative_url }}">Rádios SDR</a>
          <a class="page-link" href="{{ '/sobre/' | relative_url }}">Sobre o Projeto</a>
          <a class="page-link" href="{{ '/referencias/' | relative_url }}">Referências</a>
        </div>
      </nav>

      <button id="theme-toggle" class="theme-toggle-btn" title="Alternar Modo Escuro">
        🌙
      </button>
    </div>
    
  </div>
</header>

<script>
  const toggleButton = document.getElementById('theme-toggle');
  const htmlElement = document.documentElement;

  const savedTheme = localStorage.getItem('theme');
  const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  let initialTheme = 'light';
  
  if (savedTheme) {
    initialTheme = savedTheme;
  } else if (systemPrefersDark) {
    initialTheme = 'dark';
  }

  htmlElement.setAttribute('data-theme', initialTheme);
  updateToggleIcon(initialTheme);

  toggleButton.addEventListener('click', () => {
    const currentTheme = htmlElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    htmlElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateToggleIcon(newTheme);
  });

  function updateToggleIcon(theme) {
    if (theme === 'dark') {
      toggleButton.textContent = '☀️';
    } else {
      toggleButton.textContent = '🌙';
    }
  }
</script>
